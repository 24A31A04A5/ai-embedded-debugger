name: CI

# No secrets are used. GEMINI_API_KEY is empty, so no model calls (and no credits) are possible.
on:
  push:
    branches: [main, "preview/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GEMINI_API_KEY: ""

jobs:
  frontend:
    name: Frontend lint, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in package.json (single declaration).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: apps/web
        run: pnpm lint

      - name: Typecheck
        working-directory: apps/web
        run: pnpm typecheck

      - name: Build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          # Placeholder in valid format (pk_test_ + base64 "ci.clerk.accounts.dev$"); not a real key.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2kuY2xlcmsuYWNjb3VudHMuZGV2JA==
        run: pnpm build

  ruff:
    name: Ruff (non-blocking until Phase 12)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check apps/api --statistics
      - name: Ruff format check
        if: always()
        run: ruff format --check apps/api

  mypy:
    name: Mypy (non-blocking until Phase 12)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Mypy
        run: mypy apps/api

  tests:
    name: Pytest and offline evaluation
    runs-on: ubuntu-latest
    env:
      # Unit tests mock the database; this URL is never contacted.
      DATABASE_URL: postgresql+psycopg://ci:ci@127.0.0.1:1/unused
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Pytest
        run: pytest apps/api/tests -q
      - name: Evaluation cases (offline, mock answers, no API key)
        run: |
          python tests/evaluation/run_eval.py --validate
          python tests/evaluation/run_eval.py --dry-run --conditions baseline grounded

  migrations:
    name: Validate Alembic migration chain
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector image: document_chunks.embedding needs the "vector" extension.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aed
          POSTGRES_PASSWORD: aed_local_dev
          POSTGRES_DB: aed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aed -d aed"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      # Throwaway CI container only.
      DATABASE_URL: postgresql+psycopg://aed:aed_local_dev@localhost:5432/aed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e .

      - name: Apply migrations
        run: alembic -c db/alembic.ini upgrade head

      - name: Downgrade migrations
        run: alembic -c db/alembic.ini downgrade base
