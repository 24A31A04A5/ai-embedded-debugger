name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  api:
    name: Python lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check apps/api

      - name: Ruff format check
        run: ruff format --check apps/api

      - name: Mypy
        run: mypy apps/api

      - name: Pytest
        run: pytest apps/api/tests -v

  migrations:
    name: Validate Alembic migration chain
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aed
          POSTGRES_PASSWORD: aed_local_dev
          POSTGRES_DB: aed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aed -d aed"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://aed:aed_local_dev@localhost:5432/aed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e .

      - name: Apply migrations
        run: alembic -c db/alembic.ini upgrade head

      - name: Downgrade migrations
        run: alembic -c db/alembic.ini downgrade base
